name: Deploy to mini-PC

# Push-to-deploy: a self-hosted runner ON the mini-PC verifies the code
# (typecheck + unit tests) and, only if that passes, rebuilds the images and
# (re)starts the stack via docker compose. Reuses the host's kanban-pg / kanban-minio.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-minipc
  cancel-in-progress: false

jobs:
  # Gate: nothing deploys unless types + tests are green.
  verify:
    runs-on: [self-hosted, kanban]
    env:
      # prisma generate / tsc don't connect, but some tooling reads the var.
      DATABASE_URL: postgresql://localhost:5432/verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        shell: cmd
        run: npm ci
      - name: Generate Prisma client
        shell: cmd
        run: npx prisma generate
      - name: Typecheck
        shell: cmd
        run: npx tsc --noEmit
      - name: Unit tests
        shell: cmd
        run: npx vitest run

  deploy:
    needs: verify
    runs-on: [self-hosted, kanban]
    env:
      # Avoid the Docker Desktop credential helper (fails in non-interactive
      # service sessions) — public base images need no auth.
      DOCKER_CONFIG: C:\Users\minipc\dockercfg
      COMPOSE_BAKE: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Write deploy/.env.prod from secret
        shell: powershell
        run: |
          [System.IO.File]::WriteAllText("$(Get-Location)\deploy\.env.prod", $env:ENV_PROD)
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}

      # iiko («Статистика») config, kept OUT of the big ENV_PROD blob so it can be
      # managed per-key in the GitHub UI. Credentials are Secrets; host + order-type
      # map can be Variables (non-sensitive). Appended after ENV_PROD, so these win.
      # UTF-8 so Cyrillic in IIKO_ORDER_TYPE_MAP survives.
      - name: Append iiko config
        shell: powershell
        run: |
          $lines = "`nIIKO_BASE_URL=$env:IIKO_BASE_URL`nIIKO_LOGIN=$env:IIKO_LOGIN`nIIKO_PASS_SHA1=$env:IIKO_PASS_SHA1`nIIKO_ORDER_TYPE_MAP=$env:IIKO_ORDER_TYPE_MAP`n"
          [System.IO.File]::AppendAllText("$(Get-Location)\deploy\.env.prod", $lines, [System.Text.Encoding]::UTF8)
        env:
          # host + order-map can live in EITHER the Variables or Secrets tab
          IIKO_BASE_URL: ${{ vars.IIKO_BASE_URL || secrets.IIKO_BASE_URL }}
          IIKO_ORDER_TYPE_MAP: ${{ vars.IIKO_ORDER_TYPE_MAP || secrets.IIKO_ORDER_TYPE_MAP }}
          # credentials — Secrets only
          IIKO_LOGIN: ${{ secrets.IIKO_LOGIN }}
          IIKO_PASS_SHA1: ${{ secrets.IIKO_PASS_SHA1 }}

      - name: Build & start stack
        shell: cmd
        working-directory: deploy
        run: docker compose -f docker-compose.minipc.yml --env-file .env.prod up -d --build

      - name: Prune old images
        shell: cmd
        run: docker image prune -f
