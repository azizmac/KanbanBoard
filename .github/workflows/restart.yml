name: Restart stack

on:
  workflow_dispatch:
    inputs:
      action:
        description: "diag | restart"
        required: false
        default: "diag"

jobs:
  restart:
    runs-on: [self-hosted, kanban]
    env:
      DOCKER_CONFIG: C:\Users\minipc\dockercfg
    steps:
      - name: Diagnose (caddy real-domain TLS, locally)
        shell: cmd
        working-directory: C:\actions-runner\_work\KanbanPims\KanbanPims\deploy
        run: |
          echo ===== caddy HTTPS for kanban.freshdv.ru via 127.0.0.1:443 (correct SNI) =====
          curl.exe -s -o NUL -w "result = %%{http_code}" --max-time 15 --resolve kanban.freshdv.ru:443:127.0.0.1 https://kanban.freshdv.ru/login
          echo.
          echo ===== caddy HTTP:80 redirect via 127.0.0.1:80 =====
          curl.exe -s -o NUL -w "result = %%{http_code}" --max-time 15 --resolve kanban.freshdv.ru:80:127.0.0.1 http://kanban.freshdv.ru/login
          echo.
          echo ===== TLS cert caddy presents for the domain =====
          curl.exe -sv --max-time 15 --resolve kanban.freshdv.ru:443:127.0.0.1 https://kanban.freshdv.ru/login 1>NUL 2>cert.txt
          findstr /i "subject issuer expire SSL certificate alert handshake" cert.txt
          echo ===== mini-PC LAN IPv4 (router must forward 22/80/443 here) =====
          powershell -NoProfile -Command "Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Select-Object IPAddress,InterfaceAlias | Format-Table -AutoSize | Out-String"

      - name: Restart (only if action=restart)
        if: ${{ github.event.inputs.action == 'restart' }}
        shell: cmd
        working-directory: C:\actions-runner\_work\KanbanPims\KanbanPims\deploy
        run: |
          docker compose -f docker-compose.minipc.yml --env-file .env.prod down --remove-orphans
          docker compose -f docker-compose.minipc.yml --env-file .env.prod up -d
