name: Restart stack

on:
  workflow_dispatch:
    inputs:
      action:
        description: "diag | restart"
        required: false
        default: "diag"

jobs:
  restart:
    runs-on: [self-hosted, kanban]
    env:
      DOCKER_CONFIG: C:\Users\minipc\dockercfg
    steps:
      - name: Diagnose (stack-internal vs host network)
        shell: cmd
        working-directory: C:\actions-runner\_work\KanbanPims\KanbanPims\deploy
        run: |
          echo ===== caddy -^> app (internal docker network) =====
          docker exec deploy-caddy-1 sh -c "wget -S -O- -T 6 http://app:3000/login 2>&1 | head -8"
          echo.
          echo ===== caddy -^> app via caddy https (internal) =====
          docker exec deploy-caddy-1 sh -c "wget --no-check-certificate -S -O- -T 6 https://localhost/login 2>&1 | head -6"
          echo.
          echo ===== host listeners on 22 / 80 / 443 =====
          powershell -NoProfile -Command "Get-NetTCPConnection -State Listen | Where-Object { $_.LocalPort -eq 22 -or $_.LocalPort -eq 80 -or $_.LocalPort -eq 443 } | Select-Object LocalAddress,LocalPort,OwningProcess | Sort-Object LocalPort | Format-Table -AutoSize | Out-String"
          echo ===== firewall profiles =====
          powershell -NoProfile -Command "Get-NetFirewallProfile | Select-Object Name,Enabled | Format-Table -AutoSize | Out-String"

      - name: Restart (only if action=restart)
        if: ${{ github.event.inputs.action == 'restart' }}
        shell: cmd
        working-directory: C:\actions-runner\_work\KanbanPims\KanbanPims\deploy
        run: |
          docker compose -f docker-compose.minipc.yml --env-file .env.prod down --remove-orphans
          docker compose -f docker-compose.minipc.yml --env-file .env.prod up -d
