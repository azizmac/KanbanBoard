name: Restart stack

# Manual recovery / diagnostics lever for when the mini-PC stack is wedged but
# the runner is still online. Runs docker commands in the deploy dir left by the
# last successful deploy (no checkout / npm / build).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "diag | restart"
        required: false
        default: "diag"

jobs:
  restart:
    runs-on: [self-hosted, kanban]
    env:
      DOCKER_CONFIG: C:\Users\minipc\dockercfg
    steps:
      - name: Diagnose (network + local health)
        shell: cmd
        working-directory: C:\actions-runner\_work\KanbanPims\KanbanPims\deploy
        run: |
          echo ===== box public IP (DNS points at 95.165.71.224) =====
          curl -s --max-time 12 https://api.ipify.org
          echo.
          echo ===== app local health on box (expect 200/307) =====
          curl -s -o NUL -w "app http://localhost:3000/login = %%{http_code}" --max-time 12 http://localhost:3000/login
          echo.
          echo ===== caddy local health on box (expect 200/307) =====
          curl -s -k -o NUL -w "caddy https://localhost/login = %%{http_code}" --max-time 12 -H "Host: kanban.freshdv.ru" https://localhost/login
          echo.
          echo ===== containers =====
          docker ps --format "{{.Names}} | {{.Status}}"

      - name: Restart (only if action=restart)
        if: ${{ github.event.inputs.action == 'restart' }}
        shell: cmd
        working-directory: C:\actions-runner\_work\KanbanPims\KanbanPims\deploy
        run: |
          docker compose -f docker-compose.minipc.yml --env-file .env.prod down --remove-orphans
          docker compose -f docker-compose.minipc.yml --env-file .env.prod up -d
